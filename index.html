```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- FORM -->
    <div id="formPage">

        <h1>RESUME FORM</h1>

        <form id="resumeForm">

            <div class="section">
                <h2>Personal Information</h2>

                <label>Full Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Phone Number</label>
                <input type="text" id="phone" required>

                <label>Address</label>
                <input type="text" id="address" required>

                <label>Date of Birth</label>
                <input type="date" id="birthday">

                <label>Profile Picture</label>
                <input type="file" id="photo" accept="image/*">
            </div>

            <div class="section">
                <h2>Career Objective</h2>

                <textarea id="objective"
                    placeholder="Write your career objective"></textarea>
            </div>

            <div class="section">
                <h2>Education</h2>

                <label>School / University</label>
                <input type="text" id="school">

                <label>Course / Degree</label>
                <input type="text" id="course">

                <label>Year Graduated</label>
                <input type="text" id="year">
            </div>

            <div class="section">
                <h2>Work Experience</h2>

                <label>Company Name</label>
                <input type="text" id="company">

                <label>Position</label>
                <input type="text" id="position">

                <label>Years of Experience</label>
                <input type="text" id="experience">

                <label>Job Description</label>
                <textarea id="jobDescription"></textarea>
            </div>

            <div class="section">
                <h2>Skills</h2>

                <textarea id="skills"
                    placeholder="Example: HTML, CSS, Communication"></textarea>
            </div>

            <div class="section">
                <h2>References</h2>

                <label>Reference Name</label>
                <input type="text" id="reference">

                <label>Position</label>
                <input type="text" id="referencePosition">

                <label>Contact Number</label>
                <input type="text" id="referenceContact">
            </div>

            <button type="submit">DISPLAY RESUME</button>
            <button type="reset" class="reset">CLEAR</button>

        </form>
    </div>


    <!-- RESULT -->
    <div id="resumePage" class="resume" style="display: none;">

        <div class="resume-header">

            <img id="resultPhoto" src="" alt="Profile Picture">

            <div>
                <h1 id="resultName"></h1>
                <p id="resultEmail"></p>
                <p id="resultPhone"></p>
                <p id="resultAddress"></p>
            </div>

        </div>

        <div class="resume-section">
            <h2>CAREER OBJECTIVE</h2>
            <p id="resultObjective"></p>
        </div>

        <div class="resume-section">
            <h2>EDUCATION</h2>
            <p>
                <strong id="resultSchool"></strong><br>
                <span id="resultCourse"></span><br>
                <span id="resultYear"></span>
            </p>
        </div>

        <div class="resume-section">
            <h2>WORK EXPERIENCE</h2>
            <p>
                <strong id="resultCompany"></strong><br>
                <span id="resultPosition"></span><br>
                <span id="resultExperience"></span>
            </p>

            <p id="resultJobDescription"></p>
        </div>

        <div class="resume-section">
            <h2>SKILLS</h2>
            <p id="resultSkills"></p>
        </div>

        <div class="resume-section">
            <h2>REFERENCES</h2>
            <p>
                <strong id="resultReference"></strong><br>
                <span id="resultReferencePosition"></span><br>
                <span id="resultReferenceContact"></span>
            </p>
        </div>

        <button onclick="backToForm()">EDIT RESUME</button>
        <button onclick="window.print()">PRINT RESUME</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
```
